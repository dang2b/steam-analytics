version: 2

models:
  - name: stg_steamspy__games
    description: One row per game from the SteamSpy top 100, with owners parsed into numeric bounds and prices in dollars.
    columns:
      - name: appid
        description: Steam application ID. Primary key.
        data_tests:
          - unique
          - not_null
      - name: game_name
        description: Game title.
        data_tests:
          - not_null
      - name: owners_bucket
        description: Raw owners range as reported by SteamSpy, kept for traceability.
      - name: owners_min
        description: Lower bound of the SteamSpy owners estimate.
        data_tests:
          - not_null
      - name: owners_max
        description: Upper bound of the SteamSpy owners estimate.
        data_tests:
          - not_null
      - name: total_reviews
        description: Positive plus negative reviews.
      - name: positive_review_ratio
        description: Share of reviews that are positive, 0 to 1. Null when the game has no reviews.
      - name: price_usd
        description: Current price in US dollars.
      - name: initial_price_usd
        description: Price before any discount, in US dollars.
      - name: is_free
        description: True when the current price is zero.
      - name: concurrent_users
        description: Peak concurrent users (CCU) yesterday, per SteamSpy.
      - name: is_in_latest_top100
        description: True when the game was in the most recent load. Games that dropped out stay in raw with an older loaded_at.
        data_tests:
          - not_null
      - name: loaded_at
        description: When the row was last written by the ingestion pipeline.

  - name: stg_steamspy__catalog
    description: >
      One row per game in the full SteamSpy catalogue, with the same cleaned columns as
      stg_steamspy__games (both use the steamspy_game_columns macro).
    columns:
      - name: appid
        description: Steam application ID. Primary key.
        data_tests:
          - unique
          - not_null
      - name: owners_min
        description: Lower bound of the SteamSpy owners estimate.
        data_tests:
          - not_null
      - name: owners_max
        description: Upper bound of the SteamSpy owners estimate.
        data_tests:
          - not_null
      - name: is_in_latest_catalog
        description: >
          True when the row was written during or after the latest finished catalogue run.
          Pages commit separately, so this uses catalog_runs instead of max(loaded_at).
          False for every row until the first run finishes.
        data_tests:
          - not_null
      - name: loaded_at
        description: When the row was last written by the ingestion pipeline.

  - name: stg_steamspy__catalog_runs
    description: One row per catalogue load from catalog_runs, with run duration and list size.
    columns:
      - name: run_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: is_finished
        description: False while a run is in progress or after it failed (the next run resumes it).
      - name: pages_loaded
        description: Pages loaded so far, counting from page 0.
      - name: list_size
        description: >
          Entries in SteamSpy's list for this run: full pages times 1,000 plus the last page.
          Set when the run finishes; null for runs finished before it was recorded.
      - name: games_upserted
        description: Rows written, including games seen on more than one page.
      - name: run_hours
        description: Wall-clock duration from start to finish, including any gaps between resumed attempts.

  - name: stg_steamspy__games_history
    description: One row per game per load, from the games snapshot.
    columns:
      - name: appid
        data_tests:
          - not_null
      - name: snapshot_date
        description: Day the version was loaded.
        data_tests:
          - not_null

  - name: stg_steam__friends
    description: One row per friend of the configured Steam user.
    columns:
      - name: steam_id
        description: 64-bit Steam ID. Primary key.
        data_tests:
          - unique
          - not_null
      - name: persona_name
        description: Display name.
      - name: persona_state_code
        description: Raw online status code from the Steam Web API.
      - name: persona_state
        description: Readable online status label.
        data_tests:
          - accepted_values:
              arguments:
                values: ['offline', 'online', 'busy', 'away', 'snooze', 'looking to trade', 'looking to play']
      - name: is_current_friend
        description: True when the row came from the latest ingestion run, false for friends removed since.
        data_tests:
          - not_null
      - name: loaded_at
        description: When the row was last written by the ingestion pipeline.
