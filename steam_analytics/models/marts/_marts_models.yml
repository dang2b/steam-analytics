version: 2

models:
  - name: game_rankings
    description: One row per game in the latest top 100, with popularity, review and price metrics plus ranks. Built for Metabase.
    columns:
      - name: appid
        description: Steam application ID. Primary key.
        data_tests:
          - unique
          - not_null
      - name: owners_estimate
        description: Midpoint of the SteamSpy owners range. A rough estimate, not a count.
      - name: is_discounted
        description: True when the game currently has a discount.
      - name: price_tier
        description: Current price bucket, 'unknown' when SteamSpy returned no price.
        data_tests:
          - accepted_values:
              arguments:
                values: ['free', 'under $10', '$10 to $30', '$30 and up', 'unknown']
      - name: ccu_rank
        description: Rank by concurrent users, 1 = most played right now.
        data_tests:
          - not_null
      - name: review_score_rank
        description: Rank by positive review ratio, 1 = best reviewed.
        data_tests:
          - not_null

  - name: publisher_summary
    description: One row per publisher string, aggregating their games in the latest top 100.
    columns:
      - name: publisher
        description: Publisher as reported by SteamSpy. Co-publishers stay in one comma-separated string.
        data_tests:
          - unique
          - not_null
      - name: game_count
        description: Number of the publisher's games in the top 100.
      - name: free_game_count
        description: How many of those games are free to play.
      - name: total_concurrent_users
        description: Sum of concurrent users across the publisher's games.
      - name: total_reviews
        description: Sum of reviews across the publisher's games.
      - name: positive_review_ratio
        description: Positive reviews divided by all reviews across the publisher's games, weighted by review volume.
      - name: top_game_by_ccu
        description: The publisher's game with the most concurrent users.
      - name: ccu_rank
        description: Rank by total concurrent users.

  - name: game_daily_stats
    description: One row per game per day it was in the top 100, for trend charts. History starts on the first snapshot run.
    columns:
      - name: appid
        data_tests:
          - not_null
      - name: snapshot_date
        description: Day of the load. If the pipeline ran more than once that day, the last load wins.
        data_tests:
          - not_null
      - name: concurrent_users
        description: Peak concurrent users (CCU) the day before, per SteamSpy.

  - name: catalog_owners_distribution
    description: >
      One row per SteamSpy owners bucket across the latest full catalogue, showing how
      concentrated ownership is and how much of it the top 100 holds. Empty until the
      first catalogue run finishes.
    columns:
      - name: owners_bucket
        description: SteamSpy owners range, like '20,000 .. 50,000'. Primary key.
        data_tests:
          - unique
          - not_null
      - name: owners_min
        description: Lower bound of the bucket, for sorting.
        data_tests:
          - not_null
      - name: game_count
        description: Games in the catalogue with this owners range.
      - name: top100_game_count
        description: How many of those are in the latest top 100.
      - name: owners_estimate
        description: Sum of owners range midpoints. A rough estimate, not a count.
      - name: top100_owners_estimate
        description: The same estimate for the bucket's top 100 games only.
      - name: share_of_games
        description: Share of all catalogue games in this bucket, 0 to 1.
      - name: share_of_owners
        description: Share of all estimated owners in this bucket, 0 to 1.
