version: 2

models:
  - name: game_rankings
    description: One row per game in the latest top 100, with popularity, review and price metrics plus ranks. Built for Metabase.
    columns:
      - name: appid
        description: Steam application ID. Primary key.
        data_tests:
          - unique
          - not_null
      - name: owners_estimate
        description: Midpoint of the SteamSpy owners range. A rough estimate, not a count.
      - name: is_discounted
        description: True when the game currently has a discount.
      - name: price_tier
        description: Current price bucket, 'unknown' when SteamSpy returned no price.
        data_tests:
          - accepted_values:
              arguments:
                values: ['free', 'under $10', '$10 to $30', '$30 and up', 'unknown']
      - name: ccu_rank
        description: Rank by concurrent users, 1 = most played right now.
        data_tests:
          - not_null
      - name: review_score_rank
        description: Rank by positive review ratio, 1 = best reviewed.
        data_tests:
          - not_null

  - name: publisher_summary
    description: One row per publisher string, aggregating their games in the latest top 100.
    columns:
      - name: publisher
        description: Publisher as reported by SteamSpy. Co-publishers stay in one comma-separated string.
        data_tests:
          - unique
          - not_null
      - name: game_count
        description: Number of the publisher's games in the top 100.
      - name: free_game_count
        description: How many of those games are free to play.
      - name: total_concurrent_users
        description: Sum of concurrent users across the publisher's games.
      - name: total_reviews
        description: Sum of reviews across the publisher's games.
      - name: positive_review_ratio
        description: Positive reviews divided by all reviews across the publisher's games, weighted by review volume.
      - name: top_game_by_ccu
        description: The publisher's game with the most concurrent users.
      - name: ccu_rank
        description: Rank by total concurrent users.

  - name: game_daily_stats
    description: One row per game per day it was in the top 100, for trend charts. History starts on the first snapshot run.
    columns:
      - name: appid
        data_tests:
          - not_null
      - name: snapshot_date
        description: Day of the load. If the pipeline ran more than once that day, the last load wins.
        data_tests:
          - not_null
      - name: concurrent_users
        description: Peak concurrent users (CCU) the day before, per SteamSpy.
      - name: total_reviews
        description: Positive plus negative reviews. Changes daily for popular games, so it's the best sign that SteamSpy refreshed its data.

  - name: catalog_owners_distribution
    description: >
      One row per SteamSpy owners bucket across the latest full catalogue, showing how
      concentrated ownership is and how much of it the top 100 holds. Empty until the
      first catalogue run finishes.
    columns:
      - name: owners_bucket
        description: SteamSpy owners range, like '20,000 .. 50,000'. Primary key.
        data_tests:
          - unique
          - not_null
      - name: owners_min
        description: Lower bound of the bucket, for sorting.
        data_tests:
          - not_null
      - name: game_count
        description: Games in the catalogue with this owners range.
      - name: top100_game_count
        description: How many of those are in the latest top 100.
      - name: owners_estimate
        description: Sum of owners range midpoints. A rough estimate, not a count.
      - name: top100_owners_estimate
        description: The same estimate for the bucket's top 100 games only.
      - name: share_of_games
        description: Share of all catalogue games in this bucket, 0 to 1.
      - name: share_of_owners
        description: Share of all estimated owners in this bucket, 0 to 1.

  - name: catalog_coverage
    description: >
      One row for the latest finished catalogue run, measuring how much of SteamSpy's list it
      saw. SteamSpy orders games by an owners estimate that shifts during the day, so games
      move between pages during a run: some are seen twice, others missed. The missed ones are
      mostly games gaining owners, so low coverage biases the catalogue against rising games.
    columns:
      - name: run_id
        data_tests:
          - unique
          - not_null
      - name: run_hours
        description: Wall-clock duration of the run. Longer runs give games more time to move.
      - name: list_size
        description: Entries in SteamSpy's list.
      - name: distinct_games
        description: Games in the current catalogue.
      - name: duplicate_rows
        description: Upserts of games already seen earlier in the run.
      - name: games_missed_estimate
        description: list_size minus distinct_games. Each duplicate took the place of a game that was never seen.
      - name: coverage
        description: distinct_games / list_size, 0 to 1. Null for runs without a list_size.

  - name: game_freshness
    description: >
      One row per game that has been in the top 100, with how long its SteamSpy stats
      (concurrent users and review count) have gone unchanged. SteamSpy doesn't refresh
      every day, so this shows how old the numbers behind the rankings really are.
    columns:
      - name: appid
        data_tests:
          - unique
          - not_null
      - name: unchanged_since
        description: First snapshot of the current streak, i.e. the last day the stats changed (or the first day seen).
        data_tests:
          - not_null
      - name: last_snapshot_date
        description: Last day the game was in the top 100.
      - name: is_in_latest_snapshot
        description: True when the game is in the most recent daily snapshot.
      - name: snapshots_unchanged
        description: Daily snapshots in the current streak.
      - name: days_unchanged
        description: Calendar days from unchanged_since to last_snapshot_date, counting both. More than snapshots_unchanged when the pipeline skipped a day.

unit_tests:
  - name: game_freshness_counts_only_the_current_streak
    description: >
      Game 1 goes A, B, A: grouping by value would merge the two A days, but only the last
      day is the current streak. Game 2 keeps the same stats across a day the pipeline
      skipped. Game 3 dropped out of the top 100. Game 4's reviews change while its
      concurrent users don't, which still counts as a change.
    model: game_freshness
    given:
      - input: ref('game_daily_stats')
        rows:
          - {appid: 1, game_name: a, snapshot_date: '2026-10-01', concurrent_users: 10, total_reviews: 5}
          - {appid: 1, game_name: a, snapshot_date: '2026-10-02', concurrent_users: 20, total_reviews: 5}
          - {appid: 1, game_name: a, snapshot_date: '2026-10-03', concurrent_users: 10, total_reviews: 5}
          - {appid: 2, game_name: b, snapshot_date: '2026-10-01', concurrent_users: 30, total_reviews: 7}
          - {appid: 2, game_name: b, snapshot_date: '2026-10-03', concurrent_users: 30, total_reviews: 7}
          - {appid: 3, game_name: c, snapshot_date: '2026-10-01', concurrent_users: 40, total_reviews: 9}
          - {appid: 3, game_name: c, snapshot_date: '2026-10-02', concurrent_users: 40, total_reviews: 9}
          - {appid: 4, game_name: d, snapshot_date: '2026-10-02', concurrent_users: 50, total_reviews: 11}
          - {appid: 4, game_name: d, snapshot_date: '2026-10-03', concurrent_users: 50, total_reviews: 12}
    expect:
      rows:
        - {appid: 1, unchanged_since: '2026-10-03', last_snapshot_date: '2026-10-03', is_in_latest_snapshot: true, snapshots_unchanged: 1, days_unchanged: 1}
        - {appid: 2, unchanged_since: '2026-10-01', last_snapshot_date: '2026-10-03', is_in_latest_snapshot: true, snapshots_unchanged: 2, days_unchanged: 3}
        - {appid: 3, unchanged_since: '2026-10-01', last_snapshot_date: '2026-10-02', is_in_latest_snapshot: false, snapshots_unchanged: 2, days_unchanged: 2}
        - {appid: 4, unchanged_since: '2026-10-03', last_snapshot_date: '2026-10-03', is_in_latest_snapshot: true, snapshots_unchanged: 1, days_unchanged: 1}
