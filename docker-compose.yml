services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: steam_pipeline_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # runs once, only when the data volume is empty
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

volumes:
  pgdata:
