services:
  db:
    image: postgres:15
    environment:
      # read from .env, so the database and the pipeline share one set of credentials
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME}
    ports:
      # localhost only, so other machines on the network can't reach it
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # runs once, only when the data volume is empty
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

  metabase:
    image: metabase/metabase:v0.63.18.2
    environment:
      # Metabase's own settings, users and dashboards live in this H2 file
      MB_DB_FILE: /metabase-data/metabase.db
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - mbdata:/metabase-data
    depends_on:
      - db

volumes:
  pgdata:
  mbdata:
