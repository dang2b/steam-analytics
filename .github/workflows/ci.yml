name: CI

on:
  # PRs cover dev, so pushing to an open PR runs CI once, not twice
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest

  dbt:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: steam_pipeline_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: steam_pipeline_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Create raw tables
        run: psql -h localhost -U postgres -d steam_pipeline_db -v ON_ERROR_STOP=1 -f schema.sql

      # fixtures instead of the live APIs: no secrets needed, and the
      # build can't fail because Steam or SteamSpy is down
      - name: Load fixture data
        run: python tests/load_fixtures.py
        env:
          PYTHONPATH: .

      # the fixture catalogue is a handful of games, not tens of thousands
      - name: dbt build
        working-directory: steam_analytics
        run: dbt build --vars '{min_catalog_games: 1}'

      - name: dbt source freshness
        working-directory: steam_analytics
        run: dbt source freshness
